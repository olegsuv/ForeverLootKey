name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Builds the zip, creates a GitHub release and, once the toc has
      # "## X-Curse-Project-ID" and the CF_API_KEY secret is set, uploads to CurseForge.
      - uses: BigWigsMods/packager@v2
